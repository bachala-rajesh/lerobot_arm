
# This config file is used by ros2_control

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joints_position_controller:
      type: position_controllers/JointGroupPositionController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    servo_position_controller:
      type: forward_command_controller/ForwardCommandController

 

joints_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
      - gripper


arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
    action_ns: follow_joint_trajectory
    allow_nonzero_velocity_at_trajectory_end: true
      
gripper_controller:
  ros__parameters:
    joints:
      - gripper
    command_interfaces:
      - position
    state_interfaces:
      - position
    action_ns: follow_joint_trajectory
    allow_nonzero_velocity_at_trajectory_end: true


servo_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position
    action_ns: follow_joint_trajectory
    allow_nonzero_velocity_at_trajectory_end: true

