/follower/controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joints_position_controller:
      type: position_controllers/JointGroupPositionController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Real-time streaming controller used by MoveIt Servo. Covers the
    # `arm` planning group (6 joints, no gripper).
    servo_arm_controller:
      type: position_controllers/JointGroupPositionController

/follower/joints_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_yaw
      - wrist_roll
      - gripper

/follower/arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_yaw
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_ns: follow_joint_trajectory
    allow_nonzero_velocity_at_trajectory_end: false

/follower/gripper_controller:
  ros__parameters:
    joints:
      - gripper
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_ns: follow_joint_trajectory
    allow_nonzero_velocity_at_trajectory_end: false

/follower/servo_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_yaw
      - wrist_roll
