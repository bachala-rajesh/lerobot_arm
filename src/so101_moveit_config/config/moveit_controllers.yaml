# MoveIt uses this configuration for controller management.
# We use the ros_control_interface plugin so MoveIt discovers controllers
# directly from the ros2_control controller_manager service.

moveit_controller_manager: moveit_ros_control_interface/Ros2ControlManager

# Absolute path: where the ros2_control controller_manager lives.
# MoveIt will call /follower/controller_manager/list_controllers
# and switch_controller to discover and (de)activate controllers.
ros_control_namespace: /follower

trajectory_execution:
  allowed_start_tolerance: 0.05


