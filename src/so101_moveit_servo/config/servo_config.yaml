# MoveIt Servo configuration for the SO101 follower arm.
#
# This file is loaded into the /follower/servo_node parameter namespace.
# All topic names below are RELATIVE to that namespace, so e.g.
#   cartesian_command_in_topic: ~/delta_twist_cmds
# resolves to /follower/servo_node/delta_twist_cmds at runtime.
#
# Documentation:
#   https://github.com/ros-planning/moveit2/blob/humble/moveit_ros/moveit_servo/config/servo_config.yaml
###############################################################################

###############################################################################
# Planning context
###############################################################################
# MoveIt planning group whose joints Servo will drive. Defined in
# so101_moveit_config/config/so101_arm.srdf (5 joints, no gripper).
move_group_name: arm

# Frame velocities are interpreted in unless the incoming TwistStamped header
# specifies a different frame (Servo will TF-transform it).
planning_frame: follower_base_link

# Tip link of the arm chain. Used for the Jacobian. Must be a link inside
# `move_group_name`; the SRDF chain ends at follower_wrist_link.
ee_frame_name: follower_wrist_link

# Frame that follower_base_link is attached to in TF (used by Servo for
# transforming pose targets, if you ever use the pose-tracking interface).
robot_link_command_frame: follower_base_link

###############################################################################
# Loop rate / smoothing
###############################################################################
# 100 Hz matches the controller_manager update_rate in so101_follower_controllers.yaml.
publish_period: 0.01

# Low-pass filter on output joint positions (Butterworth coefficient).
# Larger = more smoothing, more lag. SO101 is small and stiff — keep low.
low_pass_filter_coeff: 2.0

###############################################################################
# Command interpretation
###############################################################################
# "speed_units"  -> twist linear in m/s, angular in rad/s
# "unitless"     -> incoming command is in [-1, 1]; scaled by linear/rotational_scale
command_in_type: "speed_units"

# Used only when command_in_type == "unitless"
scale:
  linear: 0.4
  rotational: 0.8
  joint: 0.5

###############################################################################
# Input topics  (relative to the servo node's namespace)
###############################################################################
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds

# Topic the *current* joint states are read from. The /follower/joint_states
# topic is published by /follower/joint_state_broadcaster; the servo node lives
# inside the /follower namespace so we use a relative name here.
joint_topic: /follower/joint_states

###############################################################################
# Output
###############################################################################
# Write to the JointGroupPositionController we added in
# so101_follower_controllers.yaml. Float64MultiArray = 5 positions, ordered as
# the controller's `joints` list (shoulder_pan ... wrist_roll).
command_out_topic: /follower/servo_arm_controller/commands
command_out_type: std_msgs/Float64MultiArray
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

# Halt the controller on shutdown by re-publishing the last commanded position.
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: true

###############################################################################
# Safety
###############################################################################
# Distance from joint limits (rad) at which Servo starts scaling the command down.
joint_limit_margin: 0.1

# Singularity handling — these are condition-number thresholds on the Jacobian.
# Servo scales velocity down between lower and hard_stop, stops at hard_stop.
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0

# Re-check the planning scene for collisions at this rate (Hz).
# Set to 0 to disable collision checking entirely (faster but unsafe).
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.03

###############################################################################
# Status / debug
###############################################################################
status_topic: ~/status
incoming_command_timeout: 0.1  # seconds; commands older than this are dropped
num_outgoing_halt_msgs_to_publish: 4
