# scene_localizer parameters.
# Node name must match the one in launch/scene_localizer.launch.py.
localizer_node:
  ros__parameters:

    # Depth image topic. MUST be aligned to the same camera frame
    # the bboxes were taken in (i.e. RGB-aligned depth on OAK-D).
    depth_topic: "/oak/stereo/image_raw"

    # CameraInfo for the depth image (fx, fy, cx, cy).
    camera_info_topic: "/oak/stereo/camera_info"

    # Target TF frame to express world coords in.
    world_frame: "world"

    # Localization tick rate (Hz).
    tick_hz: 2.0

    # Max pending rows processed per tick.
    batch_limit: 20

    # NxN patch around the bbox center used for the median depth.
    patch_size: 7

    # Reject depth samples outside this range (meters).
    min_depth: 0.1
    max_depth: 5.0

    # How long to wait for a TF transform (seconds).
    tf_timeout_sec: 0.2
